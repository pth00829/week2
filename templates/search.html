<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/search.css')}}">
    <script src="{{url_for('static',filename='js/search.js')}}" defer></script>
</head>
<body>
    <div id="search_p">
        <form id="search">
            <input type="text" name="search_txt" class="search_class" id="search_id">
            <p>
                <h3>검색범위</h3>
                <select name="choose">
                    <option value="title" selected>제목</option>
                    <option value="content">내용</option>
                    <option value="all">제목 + 내용</option>
                </select>
            </p>
            <button type='submit' id="search_btn" class="search_btn_class">검색하기</button>
            <button type="button" id="finish" class="finish_btn">돌아가기</button>
        </form>
        <p id="value"></p>
    </div>
    
</body>
</html>
