<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/success.css')}}">
    <script src="{{url_for('static',filename='js/update_board.js')}}" defer></script>
</head>
<body>
    <p><h1>게시글 수정하기</h1></p><br>
    <form id="main">
        <input type="text" id="title" name="title" class="main_txt"><br>
        <textarea name="textarea" id="textarea" class="main_txt"></textarea>
        <input type="file" name="file">
        <label>
            비밀글 <input type="checkbox" name="secret" value="true" id="secret_box">
        </label>
        <label>
            비밀번호 <input type="password" name="secret_pw" id="pw" placeholder="비밀번호를 입력하시오.">
        </label>
        <div id="files">
            
        </div>
        <p class="data_btn">
            <button type="submit" id="update" class="main_btn">수정하기</button>
            <button type="reset" id="reset" class="main_btn">리셋하기</button><br>
            <button type="button" id="return_main">메인페이지로 돌아가기</button>
        </p>
    </form>
</body>
</html>
