<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="{{url_for('static',filename='js/all_board.js')}}" defer></script>
    <link rel="stylesheet" href="{{url_for('static',filename='css/success.css')}}">
</head>
<body>
    <p><h1>내가 작성한 게시글</h1></p>
    <button type="button" id="profile">내 프로필</button>
    <button type="button" id="logout_btn">로그아웃</button>
    <button type="button" id="delete_user">탈퇴</button>
    <form id="search">
        <input type="text" name="search_txt" class="search_class" id="search_id">
        <p>
            <h3>검색범위</h3>
            <select name="choose">
                <option value="title" selected>제목</option>
                <option value="content">내용</option>
                <option value="all">제목 + 내용</option>
            </select>
        </p>
        <button type='submit' id="search_btn" class="search_btn_class">검색하기</button>
        <button type="button" id="finish" class="finish_btn">전체 목록</button>
        <button type="button" id="look" class="look_btn">게시글 보기</button>
        <button type='button' id="new_board">새로 작성하기</button></p>
    </form>
    <div id="board">

    </div>
    <div id="value"></div>
</body>
</html>
